<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arkisis Profit Engine Lite</title>
<style>
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:900px;margin:40px auto;padding:0 18px;line-height:1.5;color:#111827;background:#f8fafc}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:22px;margin:16px 0;box-shadow:0 5px 20px rgba(0,0,0,.04)}
h1{margin-bottom:4px}.muted{color:#6b7280}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label{font-size:13px;color:#374151;display:block;margin-bottom:4px}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:16px}
.kpi{font-size:28px;font-weight:700}.row{display:flex;justify-content:space-between;gap:20px;padding:9px 0;border-bottom:1px solid #eef2f7}.good{font-weight:700}.note{font-size:13px;color:#6b7280}
button{padding:11px 16px;border:0;border-radius:8px;background:#111827;color:white;cursor:pointer}
</style>
</head>
<body>
<h1>Arkisis Profit Engine Lite</h1>
<div class="muted">小規模事業者向け・利益改善シミュレーター（試作版）</div>
<div class="card">
<h2>現在値</h2>
<div class="grid">
<div><label>月商（円）</label><input id="sales" type="number" value="1000000"></div>
<div><label>客数・件数（月）</label><input id="qty" type="number" value="200"></div>
<div><label>変動原価率（%）</label><input id="costRate" type="number" value="20"></div>
<div><label>固定人件費（円）</label><input id="labor" type="number" value="250000"></div>
<div><label>その他固定費（円）</label><input id="fixed" type="number" value="200000"></div>
<div><label>広告費（円）</label><input id="ads" type="number" value="50000"></div>
</div>
<br><button onclick="calc()">計算する</button>
</div>
<div class="card">
<h2>現在の利益</h2>
<div class="kpi" id="profit">-</div>
<div class="note">売上 − 変動原価 − 人件費 − 固定費 − 広告費</div>
</div>
<div class="card">
<h2>施策比較</h2>
<div id="table"></div>
</div>
<div class="card note">試作版です。税務・会計・法務上の判断や利益保証を行うものではありません。</div>
<script>
const yen=n=>new Intl.NumberFormat('ja-JP').format(Math.round(n))+'円';
function model(priceDelta=0,qtyDelta=0,costDelta=0,laborDelta=0,adsDelta=0){
 const sales=+document.getElementById('sales').value||0, qty=+document.getElementById('qty').value||0;
 const rate=(+document.getElementById('costRate').value||0)/100;
 const labor=+document.getElementById('labor').value||0, fixed=+document.getElementById('fixed').value||0, ads=+document.getElementById('ads').value||0;
 const avg=qty?sales/qty:0, newSales=avg*(1+priceDelta)*qty*(1+qtyDelta);
 const profit=newSales-newSales*(rate+costDelta)-labor*(1+laborDelta)-fixed-ads-adsDelta;
 return {sales:newSales,profit};
}
function calc(){
 const current=model(); document.getElementById('profit').textContent=yen(current.profit);
 const scenarios=[
 ['値上げ 5%',.05,0,0,0,0],['値上げ 10%',.10,0,0,0,0],['客数 +10%',0,.10,0,0,0],['客数 +20%',0,.20,0,0,0],['原価率 -2pt',0,0,-.02,0,0],['人件費 -5%',0,0,0,-.05,0],['人件費 -10%',0,0,0,-.10,0],['広告費 +2万円 & 客数 +10%',0,.10,0,0,20000],['価格+5% & 客数+10%',.05,.10,0,0,0],['価格+5% & 客数+10% & 原価-2pt',.05,.10,-.02,0,0],['価格+5% & 客数+20% & 人件費-10%',.05,.20,0,-.10,0]
 ];
 let html='<div class="row"><b>施策</b><b>利益</b></div>';
 for(const s of scenarios){const m=model(...s.slice(1)); const diff=m.profit-current.profit; html+=`<div class="row"><span>${s[0]}</span><span class="good">${yen(m.profit)}（${diff>=0?'+':''}${yen(diff)}）</span></div>`;}
 document.getElementById('table').innerHTML=html;
}
calc();
</script>
</body>
</html>
