<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arkisis Profit Engine Lite v3</title>
<style>
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827;margin:0;padding:24px}
.wrap{max-width:980px;margin:auto}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 2px 8px rgba(0,0,0,.04)}
h1{margin:0 0 6px;font-size:28px}.muted{color:#6b7280;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
label{display:block;font-size:13px;color:#374151;margin-bottom:6px}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d1d5db;border-radius:10px;font-size:15px}
button{margin-top:14px;padding:12px 16px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.kpi{padding:16px;border-radius:12px;background:#f9fafb;border:1px solid #e5e7eb}.kpi b{font-size:22px;display:block;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left}th{background:#f9fafb}.good{font-weight:700}.best-row{font-weight:700;background:#ecfdf5}.note{font-size:12px;color:#6b7280;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
<div class="card"><h1>Arkisis Profit Engine Lite v3</h1><div class="muted">「何を変えると利益が一番増えるか」を簡易比較する無料デモ</div></div>
<div class="card">
<div class="grid">
<div><label for="sales">月商（円）</label><input id="sales" type="number" value="1000000" min="0"></div>
<div><label for="units">客数・件数（月）</label><input id="units" type="number" value="200" min="0"></div>
<div><label for="costRate">変動原価率（%）</label><input id="costRate" type="number" value="20" min="0" max="100" step="0.1"></div>
<div><label for="labor">固定人件費（円/月）</label><input id="labor" type="number" value="250000" min="0"></div>
<div><label for="fixed">その他固定費（円/月）</label><input id="fixed" type="number" value="200000" min="0"></div>
<div><label for="ads">広告費（円/月）</label><input id="ads" type="number" value="50000" min="0"></div>
</div><button id="calcBtn" type="button">利益を計算する</button>
</div>
<div class="card"><div class="kpis">
<div class="kpi">現在の営業利益<b id="profit">-</b></div>
<div class="kpi">営業利益率<b id="margin">-</b></div>
<div class="kpi">100万円目標まで<b id="gap">-</b></div>
<div class="kpi">最良シナリオ<b id="best">-</b></div>
</div></div>
<div class="card"><h2>施策比較</h2><table><thead><tr><th>施策</th><th>試算利益</th><th>現状との差</th><th>100万円との差</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="card"><div class="note">注意：このツールは入力した前提に基づく試算です。販売数・売上・利益を保証するものではありません。税務・会計・法務判断の代替ではありません。</div></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const yen = n => new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(Math.round(n));
function base(){return {sales:Number($('sales').value)||0, units:Number($('units').value)||0, rate:(Number($('costRate').value)||0)/100, labor:Number($('labor').value)||0, fixed:Number($('fixed').value)||0, ads:Number($('ads').value)||0};}
function scenario(x,s){const revenue=x.sales*(1+s.price)*(1+s.units);const rate=Math.max(0, x.rate+s.rate);const cost=revenue*rate;const p=revenue-cost-x.labor*(1+s.labor)-x.fixed-(x.ads+s.ads);return {revenue,cost,p};}
const scenarioDefs=[
['現状',0,0,0,0,0],['価格 +3%',.03,0,0,0,0],['価格 +5%',.05,0,0,0,0],['価格 +10%',.10,0,0,0,0],
['客数 +5%',0,.05,0,0,0],['客数 +10%',0,.10,0,0,0],['客数 +20%',0,.20,0,0,0],
['原価率 -2pt',0,0,-.02,0,0],['原価率 -5pt',0,0,-.05,0,0],['人件費 -5%',0,0,0,-.05,0],['人件費 -10%',0,0,0,-.10,0],
['広告費 +20,000円',0,0,0,0,20000],['広告費 +50,000円',0,0,0,0,50000],
['価格 +5% × 客数 +10%',.05,.10,0,0,0],['価格 +5% × 客数 +10% × 原価 -2pt',.05,.10,-.02,0,0],
['価格 +5% × 客数 +20% × 人件費 -10%',.05,.20,0,-.10,0],['価格 +10% × 客数 +10% × 原価 -5pt',.10,.10,-.05,0,0],
['価格 +5% × 客数 +10% × 広告 +20,000円',.05,.10,0,0,20000]
];
function calc(){
 const x=base();
 const current=scenario(x,{price:0,units:0,rate:0,labor:0,ads:0});
 const results=scenarioDefs.map(a=>{const r=scenario(x,{price:a[1],units:a[2],rate:a[3],labor:a[4],ads:a[5]});return {name:a[0],p:r.p,d:r.p-current.p,gap:1000000-r.p};});
 const bestResult=results.reduce((best,candidate)=>candidate.p>best.p?candidate:best,results[0]);
 $('profit').textContent=yen(current.p);
 $('margin').textContent=(x.sales>0?(current.p/x.sales*100):0).toFixed(1)+'%';
 $('gap').textContent=yen(Math.max(0,1000000-current.p));
 $('best').textContent=bestResult.name+' / '+yen(bestResult.p);
 $('rows').innerHTML=results.map(r=>`<tr class="${r.name===bestResult.name?'best-row':''}"><td>${r.name}${r.name===bestResult.name?' ★':''}</td><td>${yen(r.p)}</td><td class="good">${r.d>=0?'+':''}${yen(r.d)}</td><td>${yen(r.gap)}</td></tr>`).join('');
}
$('calcBtn').addEventListener('click',calc);
calc();
</script>
</body></html>
